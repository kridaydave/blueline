      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-${{ matrix.shard }}
          path: |
            artifacts/mutants-shard-summary.json
            artifacts/pass1/
            artifacts/pass2/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blueline-gate-mutant-shard-push-${{ matrix.shard }}
          path: artifacts/mutants-shard-summary.json
          if-no-files-found: warn
      - name: Fail shard if any mutation pass failed
        if: always()
        env:
          PASS1: ${{ steps.mutants_pass1.outcome }}
          PASS2: ${{ steps.mutants_pass2.outcome }}
        run: |
          echo "pass1=$PASS1 pass2=$PASS2"
          if [ "$PASS1" = "failure" ] || [ "$PASS2" = "failure" ]; then
            echo "::error title=P1 gate.security.mutation::Push mutation shard ${{ matrix.shard }}/32 failed (pass1=$PASS1, pass2=$PASS2). Inspect mutants-${{ matrix.shard }} artifact and shard summary."
            exit 1
          fi
          if [ "$PASS1" = "cancelled" ] || [ "$PASS2" = "cancelled" ]; then
            echo "::error title=P1 gate.security.mutation::Push mutation shard ${{ matrix.shard }}/32 cancelled/unknown (pass1=$PASS1, pass2=$PASS2). Cancelled is unknown fate, not a clean result."
            exit 1
          fi

