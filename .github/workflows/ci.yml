  ci-triage:
    name: "CI triage summary (fix-first)"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint-workflows
      - references
      - fmt
      - lint
      - test
      - audit
      - dogfood
      - dogfood-cargo
      - mutants-pr-aggregate
      - mutants-aggregate
    steps:
      - uses: actions/checkout@v4
      - name: Download gate and mutant aggregate artifacts
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: blueline-gate-*
          path: artifacts/triage
          merge-multiple: true
      - name: Build CI triage report
        id: triage
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          NEED_LINT_WORKFLOWS: ${{ needs.lint-workflows.result }}
          NEED_REFERENCES: ${{ needs.references.result }}
          NEED_FMT: ${{ needs.fmt.result }}
          NEED_LINT: ${{ needs.lint.result }}
          NEED_TEST: ${{ needs.test.result }}
          NEED_AUDIT: ${{ needs.audit.result }}
          NEED_DOGFOOD: ${{ needs.dogfood.result }}
          NEED_DOGFOOD_CARGO: ${{ needs.dogfood-cargo.result }}
          NEED_MUTANTS_PR: ${{ needs.mutants-pr-aggregate.result }}
          NEED_MUTANTS_PUSH: ${{ needs.mutants-aggregate.result }}
        run: |
          mkdir -p artifacts/triage
          # Synthesize gate records when artifacts are missing (skipped/event-specific jobs).
          python3 - << 'PY'
          import json, os
          from pathlib import Path
          out = Path('artifacts/triage/synthesized-needs.jsonl')
          rows = [
            ('P2','gate.workflow.lint','lint-workflows',os.environ['NEED_LINT_WORKFLOWS']),
            ('P2','gate.docs.references','references',os.environ['NEED_REFERENCES']),
            ('P0','gate.rust.format','fmt',os.environ['NEED_FMT']),
            ('P0','gate.rust.lint','lint',os.environ['NEED_LINT']),
            ('P0','gate.rust.test','test',os.environ['NEED_TEST']),
            ('P1','gate.security.audit','audit',os.environ['NEED_AUDIT']),
            ('P3','gate.dogfood.health','dogfood',os.environ['NEED_DOGFOOD']),
            ('P3','gate.dogfood.health','dogfood-cargo',os.environ['NEED_DOGFOOD_CARGO']),
            ('P1','gate.security.mutation','mutants-pr-aggregate',os.environ['NEED_MUTANTS_PR']),
            ('P1','gate.security.mutation','mutants-aggregate',os.environ['NEED_MUTANTS_PUSH']),
          ]
          with out.open('w', encoding='utf-8') as fh:
            for pri, cat, job, res in rows:
              fh.write(json.dumps({'schema_version':1,'kind':'gate','priority':pri,'category':cat,'job':job,'result':res,'reason':f'job result from workflow needs: {res}','evidence':'workflow needs graph','fix_first':'Inspect the job logs/summary and any blueline-gate-* artifact.' if res not in ('success','skipped') else ''})+'\n')
          PY
          # ci_triage.py reads *.json; convert jsonl lines to individual json files.
          python3 - << 'PY'
          import json
          from pathlib import Path
          src = Path('artifacts/triage/synthesized-needs.jsonl')
          if src.exists():
            for i, line in enumerate(src.read_text(encoding='utf-8').splitlines()):
              if line.strip():
                Path(f'artifacts/triage/need-{i}.json').write_text(line.strip()+'\n', encoding='utf-8')
          PY
          python3 scripts/ci/ci_triage.py \
            --input-dir artifacts/triage \
            --out-json artifacts/ci-triage.json \
            --out-md artifacts/ci-triage.md \
            --event "${EVENT}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blueline-ci-triage
          path: |
            artifacts/ci-triage.json
            artifacts/ci-triage.md
          if-no-files-found: warn
      - name: Fail if required gates failed
        if: always()
        env:
          NEED_LINT_WORKFLOWS: ${{ needs.lint-workflows.result }}
          NEED_REFERENCES: ${{ needs.references.result }}
          NEED_FMT: ${{ needs.fmt.result }}
          NEED_LINT: ${{ needs.lint.result }}
          NEED_TEST: ${{ needs.test.result }}
          NEED_AUDIT: ${{ needs.audit.result }}
          NEED_DOGFOOD: ${{ needs.dogfood.result }}
          NEED_DOGFOOD_CARGO: ${{ needs.dogfood-cargo.result }}
          NEED_MUTANTS_PR: ${{ needs.mutants-pr-aggregate.result }}
          NEED_MUTANTS_PUSH: ${{ needs.mutants-aggregate.result }}
        run: |
          fail=0
          for kv in \
            "P2 gate.workflow.lint/lint-workflows=$NEED_LINT_WORKFLOWS" \
            "P2 gate.docs.references/references=$NEED_REFERENCES" \
            "P0 gate.rust.format/fmt=$NEED_FMT" \
            "P0 gate.rust.lint/lint=$NEED_LINT" \
            "P0 gate.rust.test/test=$NEED_TEST" \
            "P1 gate.security.audit/audit=$NEED_AUDIT" \
            "P3 gate.dogfood.health/dogfood=$NEED_DOGFOOD" \
            "P3 gate.dogfood.health/dogfood-cargo=$NEED_DOGFOOD_CARGO" \
            "P1 gate.security.mutation/mutants-pr-aggregate=$NEED_MUTANTS_PR" \
            "P1 gate.security.mutation/mutants-aggregate=$NEED_MUTANTS_PUSH"; do
            name=${kv%%=*}; res=${kv#*=}
            case "$res" in
              success|skipped) ;;
              *) echo "::error title=CI fix-first::${name} result=${res}"; fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "CI triage found failed/cancelled required gates. See blueline-ci-triage artifact and job summaries above."
            exit 1
          fi
          echo "All required CI gates succeeded or were skipped by event conditions."
