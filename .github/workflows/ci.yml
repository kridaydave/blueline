      - name: Resolve explicit mutation targets (pass 2)
        id: mutants_targets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'src/*.rs' 'src/registry/*.rs' \
            | grep -vxFf <(printf '%s' "$BLUELINE_MUTANTS_SKIP"))
          test "${#files[@]}" -gt 0 || { echo "no mutation targets resolved" >&2; exit 1; }
          printf '%s\n' "${files[@]}" > artifacts-mutants-files.txt
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
      - name: "Mutate changed lines (pass 2: explicit src files)"
        id: mutants_pass2
